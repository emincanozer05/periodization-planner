<!--
  Formun ADRESİ; formun kendisi değil. Sporcu buraya dokununca checkin.html açılıyor:

      wellness.html#k=<token> → checkin.html#k=<token>&f=wellness

  Ayrı bir dosya olmasının tek sebebi WhatsApp/Telegram önizlemesi. Bu uygulamalar
  link paylaşılınca sayfayı kendileri çekip <title>/og:* etiketlerini okur; JavaScript
  çalıştırmaz ve adresin # kısmını sunucuya hiç göndermez. Tek bir checkin.html ile
  önizleme bu yüzden iki formda da aynı ("CoachOS — Check-in") çıkıyor, sporcu hangi
  formun linki olduğunu göremiyordu. Form başına bir dosya, form başına bir başlık.

  Token yine # kısmında duruyor: ne bu sayfanın ne checkin.html'in sunucu loglarına
  düşüyor, önizlemeyi çeken uygulamaya da gitmiyor.
-->
<style>
html,body{margin:0;height:100%;background:#101010;color:#8b9099;
  font-family:'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif;font-size:15px}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap"><div>Form açılıyor…<noscript><br/>Bu tarayıcıda JavaScript kapalı — formu açmak için açman gerekiyor.</noscript></div></div>
<script>
(function(){
  // Adresteki bilgiyi hem #k=… hem ?k=… biçiminde kabul et — checkin.html gibi.
  var p=new URLSearchParams((location.hash||'').replace(/^#/,''));
  if(!p.get('k')){
    var q=new URLSearchParams((location.search||'').replace(/^\?/,''));
    if(q.get('k'))p=q;
  }
  p.set('f','wellness');
  // replace(): geri tuşu sporcuyu bu ara sayfaya geri düşürmesin.
  location.replace('checkin.html#'+p.toString());
})();
</script>
</body>
</html>
