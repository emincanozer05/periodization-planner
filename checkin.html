<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>CoachOS — Check-in</title>
<link rel="icon" href="logo-mark.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Sporcunun doldurduğu check-in formu. Koçun uygulamasından KOPYALANAN linkle açılır:

      rpe.html#k=<token>       → antrenman sonrası İçsel Yük (sRPE) formu
      wellness.html#k=<token>  → sabah Wellness formu

  O iki adres birer kapak sayfası; buraya `&f=…` ekleyerek geçiyorlar. Ayrı dosya
  olmalarının sebebi WhatsApp önizlemesi: önizlemeyi çeken uygulama JavaScript
  çalıştırmıyor ve adresin # kısmını görmüyor, dolayısıyla form adı sayfanın kendi
  <title>/og:* etiketlerinde yazmak zorunda. Bu dosyanın kendisi ikisini de açar —
  eski `checkin.html#k=<token>&f=…` linkleri çalışmaya devam ediyor.

  Token adresin # kısmında durur: tarayıcı orayı sunucuya göndermez, yani link
  Vercel loglarına düşmez. Token, koçun uygulamasında takım başına üretilir ve
  `checkin_links/<token>` dokümanına bakar; o doküman takımın adını, logosunu ve
  kadrosunu taşır — sporcu listeden kendi adını seçer, uygulama da kimliğinden eşleştirir.
  (Tally'de isimler metin olarak eşleştiği için "eşleşmeyen isim atlandı" derdi
  vardı; burada seçilen ad bir sporcu KİMLİĞİ taşıdığı için o dert yok.)

  Gönderim `checkins` koleksiyonuna tek bir doküman yazar. Koçun uygulaması açıkken
  bunları dinler, sporcunun günlüğüne işler ve dokümanı siler.
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- Ağrı haritasının bölge kataloğu ve 3D modeli. Three.js'i kendisi, yalnızca
     Wellness formu açılınca yüklüyor; RPE formu bu dosyadan hiçbir şey indirmiyor. -->
<script src="pain-body.js?v=2"></script>
<style>
/* Uygulamanın kendi değişkenleri (index.html :root). Form, sitenin devamı gibi
   görünsün diye renk, yazı tipi ve panel dili birebir oradan alınıyor — sporcunun
   gördüğü sayfa ile koçun gördüğü uygulama iki ayrı ürün gibi durmasın. */
:root{
  --bg:#101010;--bg2:#101216;--panel:#14171c;--elevated:#181c22;--hover:#1d2128;
  --border:#23272e;--border2:#2e333c;
  --text:#f3f4f6;--text2:#b5bac4;--muted:#8b9099;--dim:#5c626c;
  --accent:#0094ff;--accent2:#5cb8ff;--accent-bg:rgba(0,148,255,.10);
  --grad:linear-gradient(135deg,#0094ff,#0080dc);
  --low-t:#46d6a0;--med-t:#fcd34d;--high-t:#ff6b5b;
  /* Gönderim sonrası çıkan özlü söz: gövde metninden ayrılsın diye hafif
     sarımtırak; sözün sahibi aynı sarının bir tık soluk tonunda. */
  --quote:#f0e0ab;--quote2:#c9b880;
  --shadow:0 4px 18px rgba(0,0,0,.55);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
h1,h2{font-weight:700;letter-spacing:-.01em}
::selection{background:var(--accent);color:#fff}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* Ne kadarının dolduğunu gösteren şerit. Formun tek "canlı" parçası: her dokunuşta
   ilerler, sporcu daha ne kadar kaldığını düğmeye basmadan görür. */
.prog{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05);z-index:20}
.prog i{display:block;height:100%;width:0;background:var(--grad);
  border-radius:0 2px 2px 0;transition:width .45s cubic-bezier(.2,.7,.3,1)}

.wrap{max-width:620px;margin:0 auto;padding:26px 16px 130px}
/* TR / EN — başlığın sağ üstünde. #root her ekranda baştan kuruluyor; düğme onun
   DIŞINDA, sıfır yükseklikli bir şeridin içinde duruyor ki form, hata ya da
   teşekkür ekranı hangisi çizilirse çizilsin yerinde kalsın. */
.langbar{max-width:620px;margin:0 auto;position:relative;height:0;z-index:5}
.seg{position:absolute;right:16px;top:20px;display:inline-flex;background:var(--panel);
  border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:11px;font-weight:600;letter-spacing:.06em;cursor:pointer;border-radius:999px;padding:4px 10px}
.seg button.on{background:var(--accent);color:#fff}
/* Dar ekranda ortalanmış wordmark'la çakışmasın diye künyeyi biraz aşağı itiyoruz. */
@media (max-width:420px){.wrap{padding-top:52px}.seg{top:14px}}
header{padding:2px 0 20px}
/* Uygulamanın kendi başlığındaki wordmark (.lp-logo-img) ile aynı iş, bir tık
   küçüğü: sporcu formu açtığında bunun hangi ürün olduğunu ilk satırdan görsün. */
.brand{display:block;height:22px;width:auto;margin:0 auto 7px;opacity:.92}
/* Wordmark'ın altındaki açılım, küçük harflerle. Küçük ve sönük: ürünün adını okuyan
   zaten görüyor, bu satır yalnızca adın ne anlama geldiğini söylüyor — başlığı ikiye
   bölmemeli. */
.tagline{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;
  letter-spacing:.16em;color:var(--dim);text-align:center;margin:0 0 18px}
/* Logo + takım adı tek bir künye kutusunda: siyah zemin sayfanın kendi zemininden
   (--bg) bir tık daha koyu, yani kutu sayfanın üstünde ayrı bir parça gibi duruyor.
   Kutu, aşağıdaki soru kartlarıyla aynı genişlikte: sayfanın iki yanına eşit uzaklıkta
   duruyor ve başlık, künye ve kartlar tek bir sütun gibi okunuyor. */
.team{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);font-weight:500;
  display:flex;align-items:center;gap:11px;
  background:#000;border:1px solid var(--border);border-radius:12px;padding:8px 15px 8px 8px}
/* Logosuz takımda kutu ince bir şeride dönüşür; o zaman soldaki fazladan boşluk
   gereksiz kalıyor, iki yan da eşitleniyor. */
.team.nologo{padding:7px 14px}
.team span{min-width:0;overflow-wrap:anywhere}
/* Takımın kendi logosu, takım adının solunda. Koçun yüklediği logo linkin arkasındaki
   kayıtla birlikte geliyor; yoksa (ya da görsel açılmazsa) img tamamen kaldırılıyor ve
   künye eskisi gibi yalnız addan ibaret kalıyor — boş bir kutu görünmesin. */
.team-logo{height:50px;width:50px;flex:none;object-fit:contain;border-radius:8px}
h1{margin:13px 0 0;font-size:27px;line-height:1.15}
h1 .yr{color:var(--muted);font-weight:500}
.sub{margin-top:8px;color:var(--muted);font-size:13px;max-width:46ch}

/* Uygulamadaki .panel: aynı zemin, aynı kenar, aynı gölge. */
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s cubic-bezier(.2,.7,.3,1)}
.card:focus-within{border-color:var(--border2);box-shadow:0 16px 38px -18px rgba(0,0,0,.65),var(--glass-hi)}
/* Cevaplanmış kart: tek işaret kenarın maviye dönmesi — dolanları taramak kolay
   olsun diye yeterli, ayrıca bir onay tiki koymaya gerek yok. */
.card.filled{border-color:rgba(0,148,255,.55)}
/* Sayfa yüklenirken kartlar sırayla belirir; hareket kısa, dikkat dağıtmaz. */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.msg{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
.card:nth-of-type(2){animation-delay:.04s}.card:nth-of-type(3){animation-delay:.08s}
.card:nth-of-type(4){animation-delay:.12s}.card:nth-of-type(5){animation-delay:.16s}
.card:nth-of-type(6){animation-delay:.2s}.card:nth-of-type(7){animation-delay:.24s}

/* Uygulamanın .panel h2 dili: metin + solunda 3px accent çubuk. */
/* Metin akışta, çubuk solda sabit: uzun bir soru (ör. "Mental stres/yorgunluk…")
   dar ekranda iki satıra kırılınca çubuk ve "zorunlu" etiketi ayrı satırlara
   düşmesin — soru kendi içinde kırılıyor, etiket de metnin hemen arkasından geliyor. */
.q{font-size:14px;font-weight:600;color:var(--text);margin:0 0 6px;line-height:1.35;
  position:relative;padding-left:12px}
.q::before{content:'';position:absolute;left:0;top:2px;width:3px;height:14px;
  background:var(--accent);border-radius:2px}
.q .req{color:var(--dim);font-size:11px;font-weight:500;margin-left:8px;white-space:nowrap}
.scale{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--dim);
  margin:0 0 12px;padding-left:12px;letter-spacing:.02em}
.scale b{font-weight:500;color:var(--muted)}
.hint{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--dim);
  margin-top:10px;letter-spacing:.02em;line-height:1.6}

/* Değer seçme rozetleri: uygulamadaki segment düğmelerinin aynısı. Seçili olan,
   birincil düğmeyle aynı accent dolguyu alır — telefonda tereddüt bırakmaz. */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-width:44px;padding:11px 13px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text2);font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .12s}
.chip:hover{border-color:var(--border2);background:var(--hover)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--grad);border-color:transparent;color:#0a0b0d;
  box-shadow:0 4px 14px rgba(0,148,255,.20)}
.chip.sm{min-width:40px;padding:9px 11px;font-size:13px}
/* Skala satırı BÖLÜNMEMELİ: 1-10 telefonda alt alta iki sıraya düşünce skala
   olmaktan çıkıp iki ayrı gruba benziyordu. Sabit genişlik yerine eşit paylı bir
   ızgara — rozetler dar ekranda inceliyor ama sıra tek kalıyor. Süre rozetleri
   (30, 40, …) skala değil, onlar sarmaya devam ediyor. */
.chips.row1{display:grid;gap:6px;row-gap:6px}
.chips.row1 .chip{min-width:0;padding-left:2px;padding-right:2px;text-align:center}
@media (max-width:420px){
  .chips.row1{gap:5px;row-gap:6px}
  .chips.row1 .chip{padding-top:10px;padding-bottom:10px;font-size:13.5px}
}
@media (max-width:340px){
  .chips.row1{gap:4px;row-gap:5px}
  .chips.row1 .chip{font-size:12.5px}
}
/* Rakamın altındaki karşılığı. Renk skalanın YÖNÜNÜ söylüyor, bu da her basamağın
   ne demek olduğunu — "3" ün orta mı iyi mi sayıldığını sporcunun tahmin etmesi
   gerekmiyor artık. Izgaranın ikinci sırasına düşüyor, yani her etiket kendi
   rozetinin tam altında. Seçilen basamağın etiketi rozetin rengine dönüyor. */
.slbl{font-size:9.5px;line-height:1.25;text-align:center;color:var(--dim);
  align-self:start;word-break:break-word;hyphens:auto;transition:color .15s}
.slbl.on{color:var(--c);font-weight:600}
@media (max-width:340px){.slbl{font-size:9px}}
/* Skalalı rozetler (RPE 1-10, wellness 1-5): her puan kendi rengini taşır, böylece
   sporcu rakamı okumadan da nerede olduğunu görür. Renk JS'ten --c olarak geliyor;
   seçilmemişken yalnız yazıda ve kenarda, seçilince dolgunun kendisinde. */
.chip.tone{color:var(--c);border-color:var(--c-soft)}
.chip.tone:hover{background:var(--c-bg);border-color:var(--c)}
.chip.tone.on{background:var(--c);border-color:var(--c);color:#0a0b0d;
  box-shadow:0 4px 14px var(--c-bg)}

input[type=date],input[type=number],input[type=text],select{
  width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:16px;font-family:inherit;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input::placeholder{color:var(--dim)}

/* Bölüm başlıkları. Tally formundaki turuncu/kırmızı/mavi başlıklar yerine tek renk
   ve üstünde küçük bir sıra etiketi: sitenin geri kalanı gibi sakin. */
.sect{padding:16px 0;border-top:1px solid var(--border)}
.sect:first-of-type{border-top:0;padding-top:0}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.sect-title{font-size:15px;font-weight:600;color:var(--text);margin:6px 0 12px}
.lbl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

/* ── Ağrı haritası: 3D model ────────────────────────────────────────────────
   Sahne (model + üstündeki düğmeler) ve hemen altındaki seçim paneli tek bir
   kutu. Şiddet renkleri uygulamanın kendi ağrı ölçeğinden (--low-t/--med-t/
   --high-t) ve yalnızca işaretlenen bölgede görünüyor — boş model gri kalıyor. */
.pb-stage{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2);margin-top:2px}
.pb-view{position:relative;height:clamp(400px,62vh,540px);overflow:hidden;
  background:radial-gradient(115% 72% at 50% 36%,#1b2230 0%,#12161d 56%,#0c0e12 100%);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* Satır içinde dikey kaydırma sayfanın: parmak modelin üstüne denk gelse de form
   aşağı kayabiliyor. Yatay kaydırma modeli çeviriyor. Tam ekranda hepsi modelin. */
.pb-view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:pan-y}
/* Hareket ipucu panelde, "dokun" satırının altında: modelin üstüne binmiyor.
   İlk dokunuştan sonra işini gördü, kalkıyor. */
.pb-hint{margin:-4px 0 10px 27px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.02em;line-height:1.5;color:var(--dim)}
.pb-hint.gone{display:none}
.pb-tools{position:absolute;right:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px}
.pb-tool{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--border2);cursor:pointer;
  background:rgba(20,23,28,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text2);
  display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s,transform .12s}
.pb-tool:hover{color:var(--text);border-color:var(--muted)}
.pb-tool:active{transform:scale(.9)}
.pb-tool svg{width:17px;height:17px;display:block}
.pb-tool.sep{margin-top:6px}
/* Hangi yüzden bakıldığı: sporcu modeli çevirdikçe ilgili düğme yanıyor. Sol üstte;
   altta dursaydı modelin ayaklarındaki SAĞ / SOL yazılarını örterdi. */
.pb-views{position:absolute;left:10px;top:10px;z-index:2;display:flex;gap:2px;padding:3px;
  border-radius:999px;background:rgba(20,23,28,.8);border:1px solid var(--border);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pb-views button{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:999px;padding:6px 12px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;transition:background .15s,color .15s}
.pb-views button:hover{color:var(--text)}
.pb-views button.on{background:var(--accent-bg);color:var(--accent2)}
@media (max-width:360px){.pb-views button{padding:6px 9px;font-size:10px}}
/* Hızlı yakınlaşma: referans görseldeki baş / el / diz / ayak kutuları gibi. Modelin
   hemen altında ayrı bir şerit — modelin üstüne binmiyor. Aynı düğmeye yeniden basmak
   ikinci görünüme geçiyor (ense, öbür el, dizlerin ve ayakların arkası). */
.pb-zonebar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--border);background:var(--bg2)}
.pb-zonebar-l{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);flex:none}
.pb-zones{display:flex;gap:5px;flex:1;min-width:0}
.pb-zones button{flex:1;min-width:0;border:1px solid var(--border2);background:rgba(20,23,28,.6);color:var(--text2);cursor:pointer;
  border-radius:9px;padding:8px 4px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s,color .15s,border-color .15s,transform .12s}
.pb-zones button:hover{color:var(--text);border-color:var(--muted)}
.pb-zones button:active{transform:scale(.95)}
.pb-zones button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.pb-stage.nogl .pb-zonebar{display:none}
@media (max-width:360px){.pb-zonebar-l{display:none}}
.pb-tip{position:absolute;left:0;top:0;z-index:3;pointer-events:none;padding:5px 9px;border-radius:7px;
  background:rgba(10,12,16,.92);border:1px solid var(--border2);color:var(--text);font-size:12px;font-weight:600;
  white-space:nowrap;opacity:0;transition:opacity .12s}
.pb-tip.on{opacity:1}
.pb-tip i{font-style:normal;font-weight:500;color:var(--c,var(--muted));margin-left:6px}
.pb-status{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:28px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.55}
.pb-spin{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--accent);
  animation:pbspin .8s linear infinite}
@keyframes pbspin{to{transform:rotate(360deg)}}
/* 3D açılamadıysa sahne tamamen kalkıyor, panel listeden seçtiriyor. */
.pb-stage.nogl .pb-view{display:none}
.pb-stage.nogl .pb-panel{border-top:0}

/* Seçim paneli: dokunulan bölge ve şiddeti. Boşken "dokun ya da listeden seç". */
.pb-panel{border-top:1px solid var(--border);background:var(--panel);padding:12px 14px 14px;min-height:96px}
.pb-empty-t{display:flex;align-items:center;gap:9px;color:var(--text2);font-size:13.5px;font-weight:500;margin:2px 0 10px}
.pb-empty-t svg{width:18px;height:18px;flex:none;color:var(--accent2)}
.pb-nogl{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.pb-panel select{font-size:15px;padding:10px 11px}
.pb-act-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pb-act-g{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
.pb-act-n{font-size:17px;font-weight:700;color:var(--text);line-height:1.25;margin-top:2px}
.pb-x{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);
  color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0;transition:color .15s,border-color .15s}
.pb-x:hover{color:var(--text);border-color:var(--border2)}

  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s}
.pb-sevb::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pb-sevb:hover{background:var(--c-bg);border-color:var(--c)}
.pb-sevb:active{transform:scale(.95)}
.pb-sevb.on{background:var(--c);border-color:var(--c);color:#0a0b0d;box-shadow:0 4px 14px var(--c-bg)}
.pb-sevb.on::before{background:#0a0b0d}

  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--dim);letter-spacing:.02em}
.pb-link{background:none;border:0;padding:0;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.pb-link:hover{color:var(--text)}
.pb-done{display:none;width:100%;margin-top:12px;padding:12px;border-radius:10px;border:0;background:var(--grad);
  color:#0a0b0d;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}

   o bölgeye çeviriyor, × kaldırıyor. */

.pb-list-h{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.pb-none{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);letter-spacing:.02em}
.pb-chips{display:flex;flex-wrap:wrap;gap:6px}
.pb-chip{display:inline-flex;align-items:stretch;border-radius:999px;border:1px solid var(--c-soft);background:var(--c-bg);
  max-width:100%;transition:border-color .15s,box-shadow .15s}
.pb-chip.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c-bg)}
.pb-chip-b{display:inline-flex;align-items:center;gap:7px;min-width:0;background:none;border:0;cursor:pointer;
  padding:6px 4px 6px 10px;color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600}
.pb-chip-b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-chip-b i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pb-chip-b em{font-style:normal;font-weight:500;color:var(--c);font-size:11.5px;white-space:nowrap}
.pb-chip-x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 10px 0 6px}
.pb-chip-x:hover{color:var(--text)}

.pb-other-btn:hover{border-color:var(--muted);color:var(--text)}

.pb-other-row .pb-sev{margin-top:9px}
.pb-other-row input.bad{border-color:var(--high-t);box-shadow:0 0 0 3px rgba(255,107,91,.14)}

   çevirme, iki parmakla yakınlaştırma/kaydırma) modele geçiyor. */

.pb-stage.pb-full{position:fixed;inset:0;z-index:60;margin:0;border:0;border-radius:0;display:flex;flex-direction:column;

.pb-full .pb-view{flex:1;height:auto;min-height:0}
.pb-full .pb-view canvas{touch-action:none}
.pb-full .pb-tools,.pb-full .pb-views{top:calc(10px + env(safe-area-inset-top))}
.pb-full .pb-panel{padding-bottom:calc(14px + env(safe-area-inset-bottom));box-shadow:0 -12px 30px -18px rgba(0,0,0,.8)}
.pb-full .pb-panel-in{max-width:620px;margin:0 auto}
.pb-full .pb-done{display:block}

/* Gönder çubuğu: sayfanın altına yapışır, arkası bulanık — uzun formda düğme aramaya
   gerek kalmasın. */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(16,16,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border)}
.bar-in{max-width:620px;margin:0 auto}
button.send{width:100%;padding:15px;border-radius:10px;border:0;background:var(--grad);color:#0a0b0d;
  font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .15s,transform .15s,box-shadow .15s}
button.send:hover{filter:brightness(1.06);box-shadow:0 6px 18px rgba(0,148,255,.22)}
button.send:active{transform:translateY(1px)}
button.send[disabled]{opacity:.45;cursor:default;box-shadow:none}
button.send .left{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;
  opacity:.7;letter-spacing:.04em}

.msg{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;line-height:1.55}
.msg.bad{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);color:#fca5a5}
.msg.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.32);color:#fcd34d}
code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;
  background:var(--bg2);border:1px solid var(--border);padding:1px 5px;border-radius:5px;color:var(--text2)}

.done{text-align:center;padding:64px 10px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.done .tick{width:74px;height:74px;margin:0 auto;border-radius:50%;
  background:var(--accent-bg);border:1px solid rgba(0,148,255,.35);
  display:flex;align-items:center;justify-content:center;font-size:34px;
  animation:pop .4s cubic-bezier(.2,.7,.3,1) both}
.done h2{margin:18px 0 6px;font-size:21px}
.done p{color:var(--muted);margin:0 0 24px;font-size:13.5px}

/* Wellness gönderiminden sonraki ödül. Sporcu formu doldurup gönderince sıradaki
   özlü söz çıkıyor — formu doldurmanın tek karşılığı "Teşekkürler!" olmasın diye.
   Ekranda görsel yok, yalnızca yazı: söz hafif sarımtırak, çünkü kutunun içinde
   tek başına duran beyaz bir paragraf sayfanın geri kalanından ayrışmıyordu.
   Sözün sahibi tırnağın sağ altında, bir tık soluk tonda. */
.done .quote{max-width:400px;margin:0 auto 20px;text-align:left}
.done .quote-text{color:var(--quote);font-size:15px;line-height:1.65;font-style:italic}
.done .quote-by{margin-top:10px;text-align:right;color:var(--quote2);font-size:12.5px;
  font-weight:600;letter-spacing:.02em}
.done .rdline{font-size:15px;font-weight:700;color:var(--text);margin:0 0 24px}
.done .rdline b{color:var(--accent2)}
.linkish{background:none;border:0;color:var(--accent2);font-size:14px;cursor:pointer;
  font-family:inherit;text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:30px;text-align:center;color:var(--dim);font-size:11px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* Listenin sıradaki elemanı: en son gösterilen sıra telefonda tutuluyor, her
   gönderimde bir sonrakine geçiliyor, sonuncudan sonra başa dönülüyor.
   localStorage kapalıysa (gizli sekme) her seferinde ilk elemana düşüyor —
   çalışmayan bir depo yüzünden ekranda hiçbir şey eksilmesin. */
function pickNext(list,key){
  if(!list||!list.length)return null;
  var last=-1;
  try{var v=parseInt(localStorage.getItem(LS_SEEN+key),10);if(!isNaN(v))last=v;}catch(e){}
  if(last<0||last>=list.length)last=-1;
  var next=(last+1)%list.length;
  try{localStorage.setItem(LS_SEEN+key,String(next));}catch(e){}
  return list[next];
}
/* Koç tarafıyla aynı formül: doldurulan wellness skorlarının ortalaması, tek
   ondalık. Zorunlu olan uyku, zihinsel ve fiziksel yorgunluk; kas ağrısı boş
   bırakılmışsa ortalamaya girmiyor. */
function readinessScore(){
  if(KIND!=='wellness')return null;
  var vals=[A.sleep,A.mentalFatigue,A.physicalFatigue,A.soreness].filter(function(v){return v!=null&&!isNaN(Number(v));});
  if(!vals.length)return null;
  var sum=vals.reduce(function(a,b){return a+Number(b);},0);
  return Math.round(sum/vals.length*10)/10;
}

/* Modeli yükle ya da (dil değişiminden sonra) hazır olanı yeni sahneye taşı. */
function pbStart(){
  var ui=PB.ui;if(!ui)return;
  var PB0=painCatalog();
  if(!PB0){PB.state='failed';}
  if(PB.state==='ready'&&PB.viewer){
    PB.viewer.attach(ui.view);
    PB.viewer.setLabels(T('pb_R'),T('pb_L'));
    PB.viewer.setExpanded(PB.full);
    PB.viewer.update({map:A.painMap,active:PB.active});
    pbStatus(null);
    return;
  }
  if(PB.state==='failed'){pbStatus('failed');return;}
  pbStatus('loading');
  if(PB.state==='loading')return;
  PB.state='loading';
  PB0.load().then(function(THREE){
    PB.viewer=PB0.create(THREE,{
      right:T('pb_R'),left:T('pb_L'),
      onPick:function(k){
        if(!PB.hinted&&PB.ui){PB.hinted=true;PB.ui.hint.classList.add('gone');}
        pbSetActive(k);
      },
      onHover:pbHover,
      onView:function(v){PB.view=v;pbPaintViews();},
      onZone:function(z){PB.zone=z;pbPaintZones();},
      // İşaretlenen bölgenin yanında çizgiyle bağlı etiket: adı ve şiddeti.
      label:function(k){
        var sev=A.painMap[k];
        return {t:pbShortLabel(k),s:sev?pbSevWord(sev):'',c:sev?PB_SEV_COL[sev]:'#ffffff'};
      },
      // Etiketler sahnedeki düğmelerin (görünüm seçici, araçlar) altına girmesin.
      labelAvoid:function(){
        var u=PB.ui;if(!u)return [];
        var base=u.view.getBoundingClientRect();
        return [u.views,u.tools].map(function(n){
          var r=n.getBoundingClientRect();
          return {left:r.left-base.left,top:r.top-base.top,right:r.right-base.left,bottom:r.bottom-base.top};
        });
      }
    });
    PB.state='ready';
    if(PB.ui)pbStart();
  }).catch(function(){
    PB.state='failed';
    if(PB.ui)pbStart();
  });
}

function pbPaintList(){

/* Tam ekran. Telefonun geri tuşu formdan çıkmasın, tam ekranı kapatsın diye tarih
   geçmişine bir adım ekleniyor; kapatınca o adım geri alınıyor.
   Sahne tam ekranda <body>'nin doğrudan çocuğu oluyor: kartın giriş animasyonu
   (transform) `position:fixed`i kartın içine hapsedebiliyordu. Yerinde aynı
   yükseklikte bir tutucu kalıyor ki form zıplamasın; çıkınca sahne geri dönüyor. */
function pbSetFull(on,fromHistory){
  on=!!on;
  if(PB.full===on)return;
  PB.full=on;
  var ui=PB.ui;
  document.documentElement.classList.toggle('pb-lock',on);
  if(ui){
    if(on&&ui.stage.parentNode){
      ui.holder=el('div');ui.holder.style.height=ui.stage.offsetHeight+'px';
      ui.stage.parentNode.replaceChild(ui.holder,ui.stage);
      document.body.appendChild(ui.stage);
    }else if(!on&&ui.holder&&ui.holder.parentNode){
      ui.holder.parentNode.replaceChild(ui.stage,ui.holder);ui.holder=null;
    }else if(!on&&ui.stage.parentNode===document.body){
      document.body.removeChild(ui.stage);
    }
    ui.stage.classList.toggle('pb-full',on);
    ui.hint.textContent=T(pbHintKey());
    var nb=pbToolBtn(on?'shrink':'expand',T(on?'pb_exit':'pb_full'),function(){pbSetFull(!PB.full);});
    nb.classList.add('sep');
    ui.fullBtn.parentNode.replaceChild(nb,ui.fullBtn);ui.fullBtn=nb;
  }
  if(PB.viewer)PB.viewer.setExpanded(on);
  if(on){
    try{history.pushState({pbFull:1},'');PB.pushed=true;}catch(e){PB.pushed=false;}
  }else if(PB.pushed){
    PB.pushed=false;
    if(!fromHistory){try{history.back();}catch(e){}}
  }
  if(!on&&ui){try{ui.stage.scrollIntoView({block:'nearest'});}catch(e){}}
}
window.addEventListener('popstate',function(){if(PB.full)pbSetFull(false,true);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&PB.full)pbSetFull(false);});
// Gönderimden sonra model artık gerekmiyor: GPU belleği ve bağlam serbest kalsın.
function pbTeardown(){
  if(PB.full)pbSetFull(false);
  if(PB.viewer){try{PB.viewer.dispose();}catch(e){}}
  PB.viewer=null;PB.ui=null;PB.state='idle';
}

  if(!A.date)return T('v_date');

    var any=['tpRPE','scRPE','gameRPE'].some(function(k){return A[k]!=null;});

/* ── Anonim oturum ───────────────────────────────────────────────────────── */
/* `signInAnonymously()` cihazda saklı bir anonim kullanıcı varsa onu SUNUCUYA
   SORMADAN geri verir. Firebase ise kullanılmayan anonim hesapları bir süre sonra
   siliyor: hesap sunucuda yokken kaydı telefonda kalmış oluyor. O kayıtla jeton
   tazelenemediği an Firebase kullanıcıyı sessizce oturumdan düşürüyor ve Firestore
   istekleri KİMLİKSİZ gitmeye başlıyor. Form yine de açılıyor — `checkin_links`
   okuması kimlik istemiyor — ama gönderim kurallardaki `request.auth != null`
   şartına takılıp "izin yok" ile dönüyor. Sahada görülen tam olarak buydu: formu ilk
   kez açan sporcu gönderebiliyor, aylar önce bir kez açmış olan gönderemiyordu;
   kurallar ikisi için de aynıyken.

   Çaresi oturumu KULLANMADAN ÖNCE doğrulamak: jeton zorla tazelenir, tazelenemiyorsa
   saklı kayıt atılıp yeni bir anonim hesap açılır. */
function isAuthClosed(code){
  return code==='auth/operation-not-allowed'||code==='auth/admin-restricted-operation';
}
// Bir oturum aç ve jetonu tazeleyerek gerçekten geçerli olduğunu doğrula.
function openSession(){
  var auth=APP.auth();
  return auth.signInAnonymously().then(function(cred){
    var u=auth.currentUser||(cred&&cred.user);
    if(!u)throw new Error(T('no_session'));
    return u.getIdToken(true).then(function(){return u;},function(e){
      /* Jeton ağ yokken tazelenemez; bu, oturumun geçersiz olduğu anlamına gelmez.
         Sahada şebeke zayıf olabildiği için elde olanla devam edilir — gönderim
         zaten kuyruğa girer, gerçekten geçersizse aşağıdaki tazeleme yakalar. */
      if((e&&e.code)==='auth/network-request-failed')return u;
      throw e;
    });
  });
}
/* Geçerli bir anonim oturum. `force` verilirse saklı kayıt en baştan atılır —
   gönderim "izin yok" ile döndüğünde bir kez böyle denenir. */
function ensureSession(force){
  var auth=APP.auth();
  var first=force
    ? auth.signOut().catch(function(){}).then(openSession)
    : openSession();
  return first.catch(function(e){
    var code=(e&&e.code)||'';
    // Anonim giriş kapalıysa ya da ağ yoksa yeniden denemenin faydası yok; sebebi
    // olduğu gibi yukarı bırak ki doğru mesaj gösterilsin.
    if(force||isAuthClosed(code)||code==='auth/network-request-failed')throw e;
    return auth.signOut().catch(function(){}).then(openSession);
  });
}

function submit(btn,errBox){
  var problem=validate();
  if(problem){
    errBox.className='msg warn';errBox.textContent=problem;errBox.style.display='';
    errBox.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  errBox.style.display='none';
  btn.disabled=true;btn.textContent=T('sending');
  var ath=(LINK.athletes||[]).filter(function(a){return a&&a.id===A.athleteId;})[0];
  var doc={
    coachUid:LINK.coachUid,teamId:LINK.teamId,token:TOKEN,
    athleteId:A.athleteId,athleteName:(ath&&ath.name)||'',
    kind:KIND,date:A.date,payload:payload(),
    at:firebase.firestore.FieldValue.serverTimestamp(),v:1
  };
  var settled=false;
  /* "İzin yok" cevabının en sık sebebi, telefonda kalmış ve artık geçerli olmayan
     anonim oturum. Sporcuya bir şey sormadan oturumu tazeleyip AYNI gönderimi bir kez
     daha dene; ikinci kez de reddedilirse sebep gerçekten koç tarafındadır. */
  var write=db.collection('checkins').add(doc).catch(function(e){
    if((e&&e.code)!=='permission-denied')throw e;
    return ensureSession(true).then(function(){
      return db.collection('checkins').add(doc);
    });
  });
  // Şebeke yavaşsa gönderim yerelde kuyruğa alınmıştır ve bağlantı gelince gider;
  // sporcuyu dönen bir düğmenin başında bekletmenin anlamı yok.
  var timer=setTimeout(function(){
    if(settled)return;settled=true;
    done(true);
  },7000);
  write.then(function(){
    if(settled)return;settled=true;clearTimeout(timer);done(false);
  }).catch(function(e){
    if(settled)return;settled=true;clearTimeout(timer);
    btn.disabled=false;btn.textContent=T('send')+' →';
    errBox.className='msg bad';errBox.style.display='';
    var code=(e&&e.code)||'';
    if(isAuthClosed(code)){
      errBox.innerHTML=T('e_anon');
    }else if(code==='permission-denied'){
      errBox.innerHTML=T('e_denied');
    }else{
      errBox.innerHTML=T('e_send').replace('{m}',String((e&&e.message)||e).replace(/[<>&]/g,''));
    }
  });
}
/* Gönderim ekranının ödül kısmı: wellness gönderiminde sıradaki özlü söz ve
   sağ altında sözün sahibi — skora bakılmıyor, gönderen herkes görüyor.
   Readiness satırı yalnızca skor hesaplanabildiğinde (üç sorudan en az biri
   cevaplandığında) ekleniyor; sözün altında bilgi olarak kalıyor. */
var QUOTE;   // bu gönderimin sözü — dil değişip ekran yeniden çizilince sıra ilerlemesin
function rewardNodes(){
  if(KIND!=='wellness')return[];
  if(QUOTE===undefined)QUOTE=pickNext(MOTIVATION,'quote');
  var item=QUOTE;
  var out=[];
  if(item){
    var qt=(LANG==='en'&&item.en)?item.en:item.text;
    var block=[el('div',{class:'quote-text',text:'\u201C'+qt+'\u201D'})];
    // Sözün sahibi listede boş bırakılmışsa satır hiç çıkmıyor: tırnağın altında
    // yalnız bir tire durmasın.
    if(item.by)block.push(el('div',{class:'quote-by',text:'\u2014 '+item.by}));
    out.push(el('div',{class:'quote'},block));
  }
  var score=readinessScore();
  if(score!=null)out.push(el('div',{class:'rdline',html:'Readiness <b>'+score.toFixed(2)+'</b> / 5.00'}));
  return out;
}
function done(queued){
  VIEW=function(){done(queued);};
  pbTeardown();
  var r=$('#root');r.innerHTML='';
  var bar=document.querySelector('.bar');if(bar)bar.remove();
  var pg=$('#progfill');if(pg)pg.style.width='100%';
  var reward=rewardNodes();
  r.appendChild(el('div',{class:'done'},[
    el('div',{class:'tick',text:queued?'↗':'✓'}),
    el('h2',{text:T(queued?'queued_h':'done_h')}),
    el('p',{text:T(queued?'queued_p':'done_p')})
  ].concat(reward,[
    el('button',{class:'linkish',text:T('again'),onclick:function(){location.reload();}})
  ])));
}

/* ── Kurulum ─────────────────────────────────────────────────────────────── */
function render(){
  VIEW=render;
  // Yeniden çizimde (dil değişince) eski dinleyiciler ve eski Gönder çubuğu gitsin.
  REFRESH=[];
  var oldBar=document.querySelector('.bar');if(oldBar)oldBar.remove();
  var r=$('#root');r.innerHTML='';
  if(!$('#prog'))document.body.insertBefore(
    el('div',{class:'prog',id:'prog'},[el('i',{id:'progfill'})]),document.body.firstChild);
  r.appendChild(buildHeader());
  var errBox=el('div',{class:'msg warn'});errBox.style.display='none';
  r.appendChild(errBox);
  var common=buildCommon();
  common.forEach(function(n){r.appendChild(n);});
  if(!((LINK.athletes||[]).filter(function(a){return a&&a.id&&(a.name||'').trim();}).length)){
    return;   // kadro yok: soruları ve Gönder düğmesini göstermenin anlamı yok
  }
  (KIND==='srpe'?buildSrpe():buildWellness()).forEach(function(n){r.appendChild(n);});
  r.appendChild(el('div',{class:'foot',text:'CoachOS · '+(LINK.teamName||'')}));
  var label=el('span',{text:T('send')});
  var left=el('span',{class:'left'});
  var btn=el('button',{class:'send',type:'button'},[label,left]);
  btn.addEventListener('click',function(){submit(btn,errBox);});
  document.body.appendChild(el('div',{class:'bar'},[el('div',{class:'bar-in'},[btn])]));
  var fill=$('#progfill');
  REFRESH.push(function(){
    var st=steps(),done=st.filter(function(x){return x.ok;}).length;
    if(fill)fill.style.width=Math.round(done/st.length*100)+'%';
    var rem=st.length-done;
    left.textContent=rem?T('left').replace('{n}',rem):'';
    label.textContent=rem?T('send'):T('send')+' →';
  });
  refreshAll();
}

/* Sağ üstteki TR / EN. Seçim telefonda saklanıyor ve o an ekranda ne varsa
   (form, hata, teşekkür) yeni dilde yeniden çiziliyor — sayfa yenilenmiyor, verilen
   cevaplar kaybolmuyor. */
function drawLang(){
  var box=$('#lang');if(!box)return;
  box.innerHTML='';
  [['tr','TR'],['en','EN']].forEach(function(o){
    box.appendChild(el('button',{type:'button',class:LANG===o[0]?'on':'',
      'aria-pressed':LANG===o[0]?'true':'false',text:o[1],onclick:function(){
        if(LANG===o[0])return;
        LANG=o[0];
        try{localStorage.setItem(LS_LANG,LANG);}catch(e){}
        document.documentElement.lang=LANG;
        drawLang();
        if(VIEW)VIEW();
        else{var b=$('#boot');if(b)b.textContent=T('loading');}
      }}));
  });
}
function start(){
  drawLang();
  var boot=$('#boot');if(boot)boot.textContent=T('loading');
  if(!TOKEN){
    fatal('f_nolink_t','f_nolink_d','f_nolink_x');
    return;
  }
  A.date=todayStr();
  ensureSession().then(function(){
    return db.collection('checkin_links').doc(TOKEN).get();
  }).then(function(snap){
    if(!snap.exists){
      fatal('f_gone_t','f_gone_d','f_gone_x');
      return;
    }
    LINK=snap.data()||{};
    if(!LINK.coachUid||!LINK.teamId){
      fatal('f_bad_t','f_bad_d','f_bad_x');
      return;
    }
    try{
      var saved=localStorage.getItem(LS_KEY+LINK.teamId);
      if(saved&&(LINK.athletes||[]).some(function(a){return a.id===saved;}))A.athleteId=saved;
    }catch(e){}
    render();
  }).catch(function(e){
    var code=(e&&e.code)||'';
    /* Firebase, kapalı bir giriş yöntemi için iki ayrı kod döndürüyor: hangisi gelirse
       gelsin sebebi tektir ve söylenmesi gereken şey de tektir. `admin-restricted-operation`
       kodunu atlamak, koça "internetini kontrol et" dedirtiyordu — sorun ağda değilken. */
    if(code==='auth/operation-not-allowed'||code==='auth/admin-restricted-operation'){
      fatal('f_anon_t','f_anon_d','f_anon_x');
    }else if(code==='permission-denied'){
      fatal('f_perm_t','f_perm_d','f_perm_x');
    }else{
      fatal('f_load_t',String((e&&e.message)||e).replace(/[<>&]/g,''),'f_load_x');
    }
  });
}
start();
</script>
