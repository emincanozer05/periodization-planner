<!--
  Kendi manifesti — uygulamanınkini PAYLAŞMIYOR, ve bu önemli: ana ekrana eklenen
  bir sayfa manifestteki start_url'den açılıyor. Ortak manifest, "Ana Ekrana Ekle"
  diyen ekip üyesini koçun giriş ekranına düşürürdü; oysa onun gitmesi gereken yer
  kendi uyarı sayfası. iOS'ta bu adım bildirim için ZORUNLU olduğundan, yanlış
  yere açılan bir kısayol tek başına bütün akışı bitiriyordu.
-->
<link rel="manifest" href="alerts.webmanifest"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<!-- Ana ekrandaki simgenin adı. iOS bunu manifestteki short_name'den DEĞİL buradan
     okuyor; ikisi aynı kalmak zorunda (bkz. alerts.webmanifest). -->
<meta name="apple-mobile-web-app-title" content="CoachOS Wellness"/>
<meta name="application-name" content="CoachOS Wellness"/>
<!-- iOS ana ekran simgesi manifestten okunmuyor; Safari yalnızca bu etiketi görüyor. -->
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="theme-color" content="#0b0d0f"/>
<!--
  EKİP ÜYESİNİN SAYFASI.

  CoachOS'ta tek bir hesap var: koçunki. Ekip üyeleri (baş antrenör, yardımcı,
  performans antrenörü, fizyoterapist, bireysel antrenör) kadroda birer KAYIT —
  giriş yapabilecekleri bir hesapları yok ve olması da gerekmiyor. Bu sayfa,
  onlara hesap açtırmadan telefonlarını uyarılara bağlamanın yolu.

  Güven modeli, uygulamanın check-in formlarında zaten kullandığının aynısı:
  adresi (token) bilen kişi o kaydın sahibidir. Koç kadro ekranından kişiye özel
  bir link üretiyor, linki WhatsApp'tan gönderiyor; linki açan telefon o ekip
  üyesinin cihazı olarak kaydediliyor. Yeni bir kimlik sistemi, şifre ya da davet
  e-postası yok.

  Sayfanın gördüğü veri, o linkin bağlı olduğu TAKIMLA sınırlı: Firestore
  kuralları her okumada eşleşme kaydına bakıyor, başka bir takımın ya da başka bir
  kulübün uyarısı bu sayfaya hiçbir şekilde gelmiyor.

  Token yine adresin # kısmında duruyor: ne bu sayfanın sunucu loglarına düşüyor,
  ne de link önizlemesi çeken uygulamalara gidiyor.

  İKİ SEKME, TEK LİNK: Wellness (sabah formu, `wellness_alerts`) ve RPE (antrenman
  sonrası formu, `rpe_reports`). Aynı günün iki verisi aynı sayfada; ekip üyesine
  ikinci bir link göndermek gerekmiyor. Bildirim yalnızca wellness uyarısı için
  geliyor — RPE bir uyarı değil, günün kaydı.

  DİL: sağ üstteki TR / EN seçimi telefonda saklanıyor; sayfa her açılışta o dilde
  açılıyor ve bildirimler de o dilde geliyor (cihaz kaydındaki `lang`).

  SAYFA YALNIZCA BUGÜNÜ GÖSTERİYOR. Liste önceden tarih sırasıyla son 50 kaydı
  diziyordu; sabah telefonu açan antrenörün ekranında dünün (bazen önceki günün)
  satırları duruyordu ve hangisinin bugüne ait olduğu ancak küçük gri tarihten
  okunabiliyordu. Bu ekranın tek sorusu "bu sabah kiminle ilgilenmeliyim" — geçmiş
  günler uygulamanın kendi sporcu ekranında zaten duruyor.
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0d0f;color:#eef2f5;
  font-family:'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5}
/* Sağ üstteki ince ışık — görseldeki zemin. Tek bir radyal geçiş; hiçbir şeyin
   okunurluğunu düşürmeyecek kadar sönük ve sabit (kaydırmayla oynamıyor). */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 85% -10%,rgba(34,167,240,.10),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px 16px 56px}

/* ── Başlık ─────────────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:16px;padding:6px 0 22px}
header .mark{flex:none;display:block;height:30px;width:auto;max-width:52%;object-fit:contain;object-position:left}
header .rule{flex:none;width:1px;align-self:stretch;margin:2px 0;
  background:linear-gradient(180deg,transparent,#2c3237 22%,#2c3237 78%,transparent)}
.who{flex:1;min-width:0}
/* Takım adı kısaltılmıyor, sarıyor: "Tofaş Ba…" diye kesilen bir kadro adı, o
   satırın tek işini yapmıyor. Yerini iki satıra kadar açabiliyor. */
.who .n{font-weight:700;font-size:15.5px;letter-spacing:.01em;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.who .r{color:#7d8894;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Dil ve sekme seçicileri — aynı kalıp: yuvarlak bir kap, içinde düğmeler ── */
.seg{display:inline-flex;background:#131619;border:1px solid #232a30;border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#7d8894;font:inherit;font-weight:700;cursor:pointer;
  border-radius:999px;padding:5px 11px;font-size:12.5px;letter-spacing:.04em}
.seg button.on{background:#0094ff;color:#fff}
.topbar{display:flex;justify-content:flex-end;margin:-8px 0 4px}
.seg.lang button{padding:4px 10px;font-size:11.5px}
.tabs{display:flex;margin:26px 0 0}
.tabs button{flex:1;padding:10px 12px;font-size:15px;letter-spacing:.02em}
.tabs button .n{display:inline-block;min-width:20px;margin-left:7px;padding:0 6px;border-radius:999px;
  background:rgba(255,255,255,.08);font-size:12px;font-variant-numeric:tabular-nums}
.tabs button.on .n{background:rgba(255,255,255,.22)}
.tabs{width:100%}

/* ── Kurulum kartı ──────────────────────────────────────────────────────── */
.card{position:relative;overflow:hidden;border-radius:16px;padding:20px 18px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(21,58,54,.55),rgba(14,22,26,.75));
  border:1px solid #1e4a45}
.card.plain{background:#131619;border-color:#232a30}
.card .body{position:relative;z-index:1;max-width:calc(100% - 118px)}
.card.nophone .body{max-width:100%}
.card h2{margin:0 0 6px;font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.card p{margin:0;color:#8d9aa4;font-size:14px}
/* Telefon çizimi kartın sağ yarısında duruyor; dar ekranda gövdeyle çakışmaması
   için 400 pikselin altında tamamen kalkıyor (metin her zaman kazanıyor). */
.phone{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:0;opacity:.85}
@media (max-width:399px){.phone{display:none}.card .body{max-width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  margin-top:16px;padding:12px 22px;border-radius:999px;border:1.5px solid #2fe0a8;
  background:transparent;color:#2fe0a8;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.fill{background:#0094ff;border-color:#0094ff;color:#fff}
.btn.sec{border-color:#2c3237;color:#eef2f5}
.btn.full{display:flex;width:100%}
.msg{margin-top:14px;padding:10px 13px;border-radius:10px;font-size:13.5px}
.msg.ok{background:rgba(47,224,168,.10);border:1px solid rgba(47,224,168,.5);color:#2fe0a8}
.msg.warn{background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.45);color:#fcd34d}
.msg.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.5);color:#ef4444}
ol{margin:10px 0 0;padding-left:20px;color:#a8b3bd;font-size:13.5px}
ol li{margin-bottom:5px}
code{font-family:ui-monospace,monospace;font-size:11.5px;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px}

/* ── Bölüm başlığı ──────────────────────────────────────────────────────── */
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:2px;margin:30px 2px 14px}
.sec-h .t{font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sec-h .c{font-size:14px;color:#6c7681}

/* ── Uyarı kartı ────────────────────────────────────────────────────────── */
.al{position:relative;overflow:hidden;background:#131619;border:1px solid #1e2429;
  border-radius:14px;padding:15px 14px 15px 18px;margin-bottom:12px}
/* Soldaki renk şeridi kendi katmanı (aşağıda .bar): kenarlıkla çizmek köşe
   yarıçapında şeridi inceltiyor, ayrı katman kartın tam boyunu alıyor. Rengi
   satır satır değiştiği için stil sayfasında değil, kartı kuran kodda. */
.al .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.al.quiet{opacity:.86}
.al .top{display:flex;align-items:center;gap:10px}
.al .nm{font-weight:700;font-size:17px;letter-spacing:.01em;text-transform:uppercase;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums}
.sc i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.al .sep{flex:none;width:1px;height:16px;background:#2c3237}
.al .dt{flex:none;font-size:12.5px;color:#6c7681;font-variant-numeric:tabular-nums}
.al .chev{flex:none;width:22px;height:22px;padding:0;border:0;background:none;color:#6c7681;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .18s ease}
.al.open .chev{transform:rotate(90deg)}
.al .why{margin-top:8px;font-size:14px;color:#8d9aa4}
.al .pn{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;border:1.5px solid;line-height:1.35}
.tag.h{color:#ef4444;border-color:rgba(239,68,68,.65);background:rgba(239,68,68,.10)}
.tag.m{color:#fcd34d;border-color:rgba(252,211,77,.55);background:rgba(252,211,77,.07)}
.tag.l{color:#7d8894;border-color:#2c3237;background:transparent}

/* Ölçüm şeridi — formun her sorusu için bir kutu, formdaki sırayla.

   Kutunun içi İKİ SATIR: üstte etiket, altta ikon + rakam. İlk hâlinde ikon
   solda, etiket ve rakam sağında duruyordu — ama 400 piksellik bir telefonda sütun
   başına ~80 piksel düşüyor ve etiketle ikonun yan yana sığdığı genişlik bu değil.
   İki satır, etikete sütunun tamamını veriyor.

   Kutular arasındaki 1 piksellik boşluk kabın rengini gösteriyor ve ayraç çizgisi
   o. Sarma olduğunda (dar ekranda) satır arası da aynı çizgiyle ayrılıyor, son
   satırdaki kutular da satırı dolduracak kadar genişliyor — boş bir hücre kalmıyor. */
.sub{margin-top:13px;display:flex;flex-wrap:wrap;gap:1px;
  background:#242a30;border-radius:11px;overflow:hidden}
.mt{flex:1 1 0;min-width:0;padding:10px 9px;background:#181c20}
.mt svg{flex:none;color:#93a7b6}
.mt .k{font-size:11.5px;color:#7d8894;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mt .row{display:flex;align-items:center;gap:6px;margin-top:3px}
.mt .v{font-size:18px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt .v small{font-size:11px;font-weight:600;color:#7d8894;margin-left:2px}
/* Dört-beş kutu dar ekranda yan yana okunmuyor; orada üçerli, en darda ikişerli
   sarıyor. Küçülterek hepsini tek satırda tutmak, sabah telefona bakan gözün
   seçemeyeceği bir rakam bırakıyordu. */
@media (max-width:459px){.sub .mt{flex-basis:40%}.sub.n5 .mt{flex-basis:30%}}
@media (max-width:359px){.sub .mt,.sub.n5 .mt{flex-basis:40%}}
@media (max-width:379px){
  /* Dar ekranda satırdaki tarih kalkıyor: liste zaten tek bir günü gösteriyor ve
     o gün bölüm başlığında yazıyor. Yerini isme bırakıyor — "KERE…" diye kesilen
     bir sporcu adı, üç kez tekrar eden bir tarihten pahalı. */
  .al .dt,.al .sep{display:none}
}

/* Kartın açılan kısmı: bildirim durumu ve kalan ayrıntı. */
.more{display:none;margin-top:13px;padding-top:12px;border-top:1px solid #1e2429;
  font-size:13px;color:#8d9aa4}
.al.open .more{display:block}
.more div+div{margin-top:5px}
.more b{color:#c6d0d8;font-weight:600}

/* RPE kartı: bölüm başına bir satır — bölümün adı, zorluk rozeti, süre, yük. */
.ss{margin-top:12px;background:#181c20;border-radius:11px;padding:4px 12px}
.ss .s{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.ss .s+.s{border-top:1px solid #242a30}
.ss .s .l{flex:1;min-width:0;color:#a8b3bd;line-height:1.3}
.ss .s .d{flex:none;color:#7d8894;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ss .s .au{flex:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:58px;text-align:right}
.ss .s .au small{font-size:11px;font-weight:600;color:#7d8894;margin-left:2px}
.rpe{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;
  padding:0 7px;border-radius:7px;font-size:13px;font-weight:700;color:#0b0d0f;font-variant-numeric:tabular-nums}
.pane[hidden]{display:none}

.none,.load{text-align:center;color:#6c7681;padding:30px 12px;font-size:14px}
.foot{margin-top:28px;text-align:center;color:#3f434a;font-size:11px}
</style>
</head>

/* BUGÜN — cihazın yerel tarihi, formun kullandığı biçimde (YYYY-MM-DD).
   toISOString() BİLEREK kullanılmıyor: o UTC'ye çeviriyor ve Türkiye saatiyle
   gece yarısından sonraki üç saatte bir önceki günü döndürüyor — sabahın erken
   saatinde form dolduran sporcu listeden düşerdi. */
function todayKey(d){
  d=d||new Date();
  var p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function prettyDate(key){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key||''));
  if(!m)return String(key||'');
  var mon=T('months')[Number(m[2])-1];
  return LANG==='en'?mon+' '+Number(m[3]):Number(m[3])+' '+mon;
}

/* Uygulamanın kendi 1-5 renk skalası — checkin.html'deki SCORE_COLORS ile aynı
   sıra ve aynı yön: 1 kırmızı (kötü) … 5 mavi (iyi). */
var SCORE_COLORS=['#ef4444','#f97316','#fcd34d','#46d6a0','#0094ff'];
function scoreColor(v){
  if(v==null)return '#5f646d';
  var step=Math.min(5,Math.max(1,Math.round(Number(v))));
  return SCORE_COLORS[step-1];
}
function fmtScore(v){

/* ── Listenin sırası: önce AĞIRLIK ───────────────────────────────────────────
   Liste bugüne kadar yalnızca tarihe göre diziliyordu, yani aynı sabahın uyarıları
   rastgele bir sırayla geliyordu: koç telefonu açtığında en üstte 4.3'lük bir
   sporcuyu, aşağıda omzu ağrıyanı görüyordu. Oysa ekranın tek işi "bu sabah önce
   kiminle ilgilenmeliyim" sorusunu cevaplamak. Liste artık tek bir günü
   gösterdiği için tarih sıralamadan tamamen çıktı; sıra şöyle kuruluyor:
     1) yüksek ağrı bildirenler,
     2) orta ağrı bildirenler,
     3) kriteri aşan ama ağrısı olmayanlar (düşük skor),
     4) uyarı vermeyen gönderimler,
   her grubun içinde de en düşük wellness skoru üstte. Eşitlik kalırsa daha çok
   bölgesi ağrıyan, o da eşitse isim sırası. */
function painRank(a){
  if((a.painHigh||[]).length)return 0;
  if((a.painModerate||[]).length)return 1;
  return isFlagged(a)?2:3;
}
/* Kriteri aşan gönderim mi. `flagged` alanı sunucudan geliyor ama eski kayıtlarda
   (bu sürümden önce yazılanlar) yok — onların HEPSİ kriteri aştığı için kaydedilmişti,
   o yüzden alan yoksa doğru kabul ediliyor. */
function isFlagged(a){
  if(a&&typeof a.flagged==='boolean')return a.flagged;
  return true;
}
function bySeverity(a,b){
  var r=painRank(a)-painRank(b);
  if(r)return r;
  // Skoru olmayan gönderim (nadir) grubun en altına: sıralayacak bir şey yok.
  var oa=(a.overall==null)?99:Number(a.overall),ob=(b.overall==null)?99:Number(b.overall);
  if(oa!==ob)return oa-ob;
  var pa=(a.painHigh||[]).length+(a.painModerate||[]).length,
      pb=(b.painHigh||[]).length+(b.painModerate||[]).length;
  if(pa!==pb)return pb-pa;
  return String(a.athleteName||'').localeCompare(String(b.athleteName||''),'tr');
}

/* RPE listesinin sırası: günün en zorlandığı sporcu en üstte (en yüksek RPE), eşitse
   günün yükü daha büyük olan, o da eşitse isim sırası. */
function byExertion(a,b){
  var ra=a.maxRpe==null?-1:Number(a.maxRpe),rb=b.maxRpe==null?-1:Number(b.maxRpe);
  if(ra!==rb)return rb-ra;
  var la=a.totalLoad==null?-1:Number(a.totalLoad),lb=b.totalLoad==null?-1:Number(b.totalLoad);
  if(la!==lb)return lb-la;
  return String(a.athleteName||'').localeCompare(String(b.athleteName||''),'tr');
}
/* RPE rozetinin rengi — checkin.html'deki RPE_COLORS: 1 mavi (kolay) → 10 kırmızı. */
var RPE_COLORS=['#0094ff','#22a5f5','#2ec4b6','#46d6a0','#9ed163',
                '#fcd34d','#f7a832','#f97316','#f2542d','#ef4444'];
function rpeColor(v){
  if(v==null)return '#5f646d';
  var step=Math.min(10,Math.max(1,Math.round(Number(v))));
  return RPE_COLORS[step-1];
}

/* ── Firebase ────────────────────────────────────────────────────────────────
   Kendi uygulama adıyla kuruluyor. Sebebi checkin.html'dekiyle birebir aynı:
   Firebase oturumu tarayıcıda `firebase:authUser:<apiKey>:<appAdı>` anahtarıyla
   saklanıyor ve varsayılan adı paylaşan iki sayfa birbirinin oturumunu eziyor.
   Bu sayfa anonim giriş yapıyor; koç aynı telefondan kendi hesabına da giriyorsa
   ikisi birbirine dokunmuyor. */
var CFG=(typeof COACHOS_FCM!=='undefined')?COACHOS_FCM:null;
var APP_NAME='alerts',APP=null,db=null;
if(CFG){
  try{APP=firebase.app(APP_NAME);}catch(e){APP=firebase.initializeApp(CFG.firebase,APP_NAME);}
  // Bazı operatör/proxy ağları Firestore'un akış bağlantısını tamponluyor; düz HTTP zorlanıyor.
  try{APP.firestore().settings({experimentalForceLongPolling:true});}catch(e){}
  db=APP.firestore();
}

/* Token, adresin # kısmında geliyor — ama ana ekrana eklenen kısayol manifestteki
   start_url'den açılıyor ve o adreste # kısmı yok. iOS'ta bildirim ZORUNLU olarak
   ana ekrandan geçtiği için, hatırlanmayan bir token bütün akışı bitiriyordu.
   Bu yüzden token bir kez görüldüğünde cihaza yazılıyor ve # kısmı olmadan
   açıldığında oradan okunuyor. Cihazda kalması bir risk getirmiyor: linkin
   kendisi zaten o telefonda, tarayıcı geçmişinde duruyor. */

else{try{TOKEN=(localStorage.getItem(LS_TOKEN)||'').trim();}catch(e){}}

// iOS'ta web push YALNIZCA ana ekrana eklenmiş sitede çalışıyor (Apple'ın kuralı).
var IS_STANDALONE=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function platform(){
  if(IS_IOS)return IS_STANDALONE?'ios-pwa':'ios-safari';

}

/* Sağ üstteki TR / EN. Dil değişince sayfa yeniden yükleniyor: her metin baştan,
   seçilen dilde kuruluyor ve bildirim izni zaten verilmişse açılıştaki kayıt
   tazelemesi cihaz kaydındaki dili de güncelliyor. Açık kalan sekme sayısı ve
   kısmen çevrilmiş bir ekran riski, bir yenilemenin maliyetinden büyük. */
function drawLang(){

/* ── Uygulama olarak yükleme ────────────────────────────────────────────────
   Bu sayfanın ana ekrana kurulması bir süs değil, bildirimin ÖN KOŞULU: iOS'ta
   web push yalnızca kurulmuş sayfada çalışıyor, Android'de de kurulu sayfa
   bildirimi tarayıcı sekmesinden çok daha güvenilir tutuyor.

   Android/Chrome kurulabilir olduğunda `beforeinstallprompt` olayını gönderiyor
   ve olay SAKLANABİLİYOR: yakalayıp kendi düğmemize bağlıyoruz, çünkü tarayıcının
   kendi ipucu adres çubuğunun içinde küçük bir simge olarak kalıyor ve sahada
   kimse görmüyordu. iOS'ta böyle bir olay yok — Apple'ın tek yolu Paylaş →
   "Ana Ekrana Ekle" ve bunu ancak yazıyla anlatabiliyoruz (aşağıdaki adımlar).

   Olayın sayfa açılır açılmaz gelebildiğine dikkat: dinleyici her şeyden ÖNCE
   kuruluyor, yoksa Firestore'u beklerken olay kaçıyor ve düğme hiç çıkmıyor. */
var INSTALL_EVENT=null;
var INSTALL_WAITED=false;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();               // tarayıcının kendi mini çubuğu yerine bizim düğmemiz
  INSTALL_EVENT=e;
  drawInstall();
});
window.addEventListener('appinstalled',function(){
  INSTALL_EVENT=null;
  drawInstall();
});

function drawInstall(){
  installBox.innerHTML='';
  // Zaten uygulama olarak açılmışsa söylenecek bir şey yok.
  if(IS_STANDALONE)return;
  // Link yoksa sayfanın kendisi çalışmıyor; kurulum önerisi anlamsız olurdu.
  if(!TOKEN)return;

  if(INSTALL_EVENT){
    var card=el('div',{class:'card plain nophone'});
    var body=el('div',{class:'body'});
    body.appendChild(el('h2',{text:T('install_h')}));
    body.appendChild(el('p',{text:T('install_p')}));
    var msg=el('div');
    var btn=el('button',{class:'btn fill',onclick:function(){
      var ev=INSTALL_EVENT;
      if(!ev)return;
      btn.disabled=true;
      ev.prompt();
      ev.userChoice.then(function(res){
        // Reddedilen istem tekrar kullanılamıyor; düğme ancak tarayıcı olayı
        // yeniden gönderdiğinde geri geliyor.
        INSTALL_EVENT=null;
        if(res&&res.outcome==='accepted'){card.remove();return;}
        btn.disabled=false;
        show(msg,'warn',T('install_cancel'));
      }).catch(function(){btn.disabled=false;});
    }});
    btn.appendChild(icon(ICON.down,18));
    btn.appendChild(el('span',{text:T('install_btn')}));
    body.appendChild(btn);
    body.appendChild(msg);
    card.appendChild(body);
    installBox.appendChild(card);
    return;
  }

  /* Olay hiç gelmediyse — ve gelmesi için birkaç saniye beklendiyse — elle kurulum.
     Android'de bunun iki sebebi oluyor: tarayıcı sayfayı henüz değerlendirmemiştir
     (bekleme bunun için), ya da WhatsApp/Instagram gibi bir uygulamanın KENDİ
     tarayıcısındasındır — orada kurulum diye bir şey yok, çıkış "tarayıcıda aç".

     Üçüncü bir sebep daha var ve teşhisi zor: tarayıcı, KURULU bir uygulamanın
     kapsamına düşen sayfa için ikinci kurulum teklif etmiyor, "zaten yüklü" diyor.
     CoachOS'un kapsamı bir zamanlar bütün siteyi kaplıyordu ve bu sayfa da onun
     içinde kalıyordu. Kapsam daraltıldı; ama KURULU uygulamanın kaydı telefonda
     eski kapsamla durmaya devam ediyor, o yüzden çare aşağıdaki son madde. */
  if(!IS_IOS&&INSTALL_WAITED){
    var c3=el('div',{class:'card plain nophone'});
    var b3=el('div',{class:'body'});
    b3.appendChild(el('h2',{text:T('install_h')}));
    b3.appendChild(el('p',{text:T('install_manual')}));
    var ol3=el('ol');
    T('install_steps').forEach(function(x){ol3.appendChild(el('li',{text:x}));});
    b3.appendChild(ol3);
    c3.appendChild(b3);
    installBox.appendChild(c3);
    return;
  }

  /* iOS: `beforeinstallprompt` hiç gelmiyor, tek yol elle. Bu kart bildirim
     kartından AYRI duruyor çünkü bildirim izni verilmiş olsa bile (masaüstünde
     verilmiş olabilir) telefonun ana ekranında uygulamanın olması ayrı bir iş. */
  if(IS_IOS){
    var c2=el('div',{class:'card plain nophone'});
    var b2=el('div',{class:'body'});
    b2.appendChild(el('h2',{text:T('install_h')}));
    b2.appendChild(el('p',{text:T('install_ios')}));
    var ol=el('ol');
    T('install_ios_steps').forEach(function(s){ol.appendChild(el('li',{text:s}));});
    b2.appendChild(ol);
    c2.appendChild(b2);
    installBox.appendChild(c2);
  }
}

/* Service worker'ı sayfa açılır açılmaz kaydet.

   İki sebebi var ve ikisi de kurulumla ilgili: (1) tarayıcı bir sayfayı ancak
   kapsamında ETKİN bir service worker varken kurulabilir sayıyor — kayıt bildirim
   düğmesine basılana kadar beklerse `beforeinstallprompt` hiç gelmiyor ve "ana
   ekrana ekle" düğmesi hiç çıkmıyordu; (2) bildirim açılırken worker'ın zaten
   etkin olması, oradaki 20 saniyelik beklemeyi çoğu zaman sıfırlıyor. */
function warmServiceWorker(){
  if(!('serviceWorker' in navigator)||!window.isSecureContext)return;
  readyServiceWorker().catch(function(){/* kurulum akışı zaten kendi hatasını gösteriyor */});
}

function boot(){
  drawLang();
  drawInstall();
  /* Tarayıcı kurulabilirliği hemen değerlendirmiyor; olay çoğu zaman sayfa
     yüklendikten bir-iki saniye sonra geliyor. Elle kurulum yönergesini hemen
     basmak, düğme az sonra çıkacakken kullanıcıyı menüye yollamak olurdu. */
  setTimeout(function(){
    if(INSTALL_EVENT)return;
    INSTALL_WAITED=true;
    drawInstall();
  },3500);
  warmServiceWorker();
  if(!CFG){
    show(setupBox,'bad',T('no_config'));
    return;
  }
  if(!TOKEN){
    /* Bildirimler artık bu sayfaya açılıyor — koçun KENDİ cihazı da buraya
       düşebiliyor. O cihaz kadroda bir ekip üyesi olarak eşleşmemişse elinde
       hiçbir şey kalmasın istemiyoruz: uygulamanın kendisine bir çıkış duruyor. */
    show(setupBox,'warn',T('no_token'));
    setupBox.appendChild(el('a',{class:'btn sec full',href:'index.html',
      style:'text-decoration:none;margin-top:12px',text:T('open_app')}));
    return;
  }
  setupBox.appendChild(el('div',{class:'load',text:T('connecting')}));

  openSession()
    .then(function(u){USER=u;return db.collection('staff_links').doc(TOKEN).get();})
    .then(function(snap){
      if(!snap.exists)throw new Error('LINK_YOK');
      LINK=snap.data()||{};
      /* Başlığın sağındaki isim: görseldeki gibi TAKIM adı. Ekip üyesinin kendi
         adı ve rolü altındaki satırda duruyor — telefonu elinde tutan kişi zaten
         kim olduğunu biliyor, bilmediği şey hangi kadronun sabahına baktığı. */
      document.getElementById('who-n').textContent=(LINK.teamName||'').trim()
        ||(LINK.staffName||'').trim()||T('team');
      document.getElementById('who-r').textContent=
        [(LINK.staffName||'').trim(),LINK.roleLabel].filter(Boolean).join(' · ');
      // Eşleşme kaydı: kuralların "bu kişi bu takımı görebilir" kontrolü buna bakıyor.
      return db.collection('staff_members').doc(USER.uid).set({
        coachUid:LINK.coachUid,teamId:LINK.teamId,staffId:LINK.staffId,
        role:LINK.role||'',token:TOKEN,
        pairedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    })
    .then(function(){
      drawSetup();
      watchFeed();
    })
    .catch(function(e){
      var code=(e&&e.code)||'';
      if((e&&e.message)==='LINK_YOK'){
        // Koç linki geçersiz kılmış: hatırlanan kopyayı da at, yoksa bu telefon
        // her açılışta aynı ölü adresi denemeye devam eder.
        try{localStorage.removeItem(LS_TOKEN);}catch(e2){}
        show(setupBox,'warn',T('link_dead'));
      }else if(code==='auth/operation-not-allowed'||code==='auth/admin-restricted-operation'){
        show(setupBox,'bad',T('no_anon'));
      }else if(code==='permission-denied'){
        show(setupBox,'bad',T('denied'));
      }else{
        show(setupBox,'bad',T('cant_connect')+((e&&e.message)||e));
      }
    });
}

/* Geçerli bir anonim oturum. checkin.html'deki ile aynı dert: Firebase
   kullanılmayan anonim hesapları bir süre sonra siliyor, kayıt telefonda kalmış
   oluyor ve o kayıtla jeton tazelenemediği an istekler kimliksiz gidiyor. Çare
   oturumu KULLANMADAN ÖNCE doğrulamak. */
function openSession(){
  var auth=APP.auth();
  return auth.signInAnonymously().then(function(cred){
    var u=auth.currentUser||(cred&&cred.user);
    if(!u)throw new Error(T('no_session'));
    return u.getIdToken(true).then(function(){return u;},function(e){
      // Ağ yokken jeton tazelenemez; bu oturumun geçersiz olduğu anlamına gelmez.
      if((e&&e.code)==='auth/network-request-failed')return u;
      return auth.signOut().catch(function(){}).then(function(){
        return auth.signInAnonymously().then(function(c2){return auth.currentUser||c2.user;});
      });
    });
  });
}

/* Karttaki telefon çizimi. Görseldeki gibi: eğik bir telefon gövdesi, içinde bir
   mesaj kutusu ve sağ üstünde iki kıvılcım. */
function phoneArt(){
  var ns='http://www.w3.org/2000/svg';
  var s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 120 130');
  s.setAttribute('width','104');s.setAttribute('height','112');
  s.setAttribute('fill','none');s.setAttribute('aria-hidden','true');
  s.setAttribute('class','phone');
  [['M30 24h44a10 10 0 0 1 10 10v70a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V34a10 10 0 0 1 10-10z',
    {stroke:'#2a7d72','stroke-width':'2.4',fill:'rgba(47,224,168,.05)'}],
   ['M44 31h16',{stroke:'#2a7d72','stroke-width':'2.4','stroke-linecap':'round'}],
   ['M34 56h36a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6V62a6 6 0 0 1 6-6z',
    {fill:'rgba(47,224,168,.16)'}],
   ['M37 66h22M37 76h14',{stroke:'#8fe9cd','stroke-width':'3','stroke-linecap':'round'}],
   ['M97 26l6-9M101 40h11M99 52l8 6',{stroke:'#2fe0a8','stroke-width':'3','stroke-linecap':'round'}]
  ].forEach(function(pair){
    var p=document.createElementNS(ns,'path');
    p.setAttribute('d',pair[0]);
    Object.keys(pair[1]).forEach(function(k){p.setAttribute(k,pair[1][k]);});
    s.appendChild(p);
  });
  return s;
}

function drawSetup(){
  setupBox.innerHTML='';
  var card=el('div',{class:'card'});
  var body=el('div',{class:'body'});
  card.appendChild(body);
  setupBox.appendChild(card);

  var supported=('Notification' in window)&&('serviceWorker' in navigator)&&window.isSecureContext;

  if(!supported){
    card.classList.add('nophone');
    body.appendChild(el('h2',{text:T('push_unsupported_h')}));
    body.appendChild(el('p',{text:T('push_unsupported_p')}));
    return;
  }
  // iOS: ana ekrana eklenmeden bildirim izni hiç istenemiyor.
  if(IS_IOS&&!IS_STANDALONE){
    card.classList.add('nophone');
    body.appendChild(el('h2',{text:T('ios_step_h')}));
    body.appendChild(el('p',{text:T('ios_step_p')}));
    return;
  }
  if(!CFG.vapidKey){
    card.classList.add('nophone');
    body.appendChild(el('h2',{text:T('no_vapid_h')}));
    body.appendChild(el('p',{text:T('no_vapid_p')}));
    return;
  }
  if(Notification.permission==='denied'){
    card.classList.add('nophone');
    body.appendChild(el('h2',{text:T('blocked_h')}));
    body.appendChild(el('p',{text:T('blocked_p')}));
    return;
  }

  card.appendChild(phoneArt());
  body.appendChild(el('h2',{text:T('push_h')}));
  body.appendChild(el('p',{text:T('push_p')}));
  var msg=el('div');
  var btn=el('button',{class:'btn',text:T('push_btn'),onclick:function(){enable(btn,msg);}});
  body.appendChild(btn);
  body.appendChild(msg);

  // Zaten açıksa token'ı sessizce tazele — cihaz token'ları dönebiliyor.
  if(Notification.permission==='granted'){
    btn.disabled=true;
    register().then(function(){
      // Görseldeki hâli: düğme kalkmıyor, "Bildirimler açık ✓" olarak duruyor —
      // ekip üyesi bakınca durumu tek bakışta görsün.
      btn.disabled=true;
      btn.textContent=T('push_on');
    }).catch(function(e){
      btn.disabled=false;
      btn.textContent=T('push_btn');
      show(msg,'warn',T('push_refresh_fail')+((e&&e.message)||e));
    });
  }
}

function enable(btn,msg){
  btn.disabled=true;btn.textContent=T('push_opening');
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){
      btn.disabled=false;btn.textContent=T('push_btn');
      show(msg,'warn',T('push_refused'));
      return;
    }
    return register().then(function(){
      btn.disabled=true;
      btn.textContent=T('push_on');
    });
  }).catch(function(e){
    btn.disabled=false;btn.textContent=T('push_btn');
    show(msg,'bad',T('push_fail')+((e&&e.message)||e));
  });
}

/* ETKİN bir service worker döndürür.

   `register()` kaydı BAŞLATIR başlatmaz dönüyor; worker o anda hâlâ 'installing'
   olabiliyor ve push aboneliği etkin bir worker istiyor. Beklenmezse tarayıcı
   "Subscription failed - no active Service Worker" diyor: kayıt başarılı
   görünürken bildirim açılamıyor. 'redundant' ise worker betiğinin hiç
   yüklenemediği anlamına geliyor — sebebi genelde push-config.js'in eksik olması. */
var SW_FILE='firebase-messaging-sw.js';
function readyServiceWorker(){
  // Sayfaya göre — uygulama bir alt dizinde de yayınlanabiliyor.
  var swPath=location.pathname.replace(/[^/]*$/,'')+SW_FILE;
  return navigator.serviceWorker.register(swPath).then(function(reg){
    if(reg.active)return reg;
    var w=reg.installing||reg.waiting;
    if(!w)return navigator.serviceWorker.ready.then(function(r){return r||reg;});
    return new Promise(function(res,rej){
      var timer=setTimeout(function(){cleanup();rej(new Error(T('sw_timeout')));},20000);
      function cleanup(){clearTimeout(timer);w.removeEventListener('statechange',onChange);}
      function onChange(){
        if(w.state==='activated'){cleanup();res();}
        else if(w.state==='redundant'){cleanup();rej(new Error(T('sw_redundant').replace('{f}',SW_FILE)));}
      }
      w.addEventListener('statechange',onChange);
      onChange();
    }).then(function(){
      return navigator.serviceWorker.ready.then(function(r){return r||reg;});
    });
  });
}

/* SAYFA AÇIKKEN gelen bildirimi göstermek.

   Firebase'in service worker'ı, sitenin GÖRÜNÜR bir sekmesi varsa bildirimi
   kendisi GÖSTERMİYOR: payload'ı sayfaya yollayıp çıkıyor. Bu sayfada onu
   karşılayan kimse olmadığı için, uyarı tam da ekip üyesi sayfayı açık tuttuğu
   anlarda sessizce düşüyordu — "bazen geliyor bazen gelmiyor"un bir sebebi buydu.
   Bildirimi burada elle gösteriyoruz; worker göstermediği için ikinci kopya yok.

   Bir kez kuruluyor: register() hem açılışta hem düğmeye basınca çağrılıyor. */
var FOREGROUND_ON=false;
function listenForeground(){
  if(FOREGROUND_ON)return;
  try{
    firebase.messaging(APP).onMessage(function(payload){
      var d=(payload&&payload.data)||{},n=(payload&&payload.notification)||{};
      navigator.serviceWorker.ready.then(function(reg){
        if(!reg)return;
        // Etiket sunucudakiyle aynı (alertId): aynı sporcunun aynı günkü uyarısı
        // yeni bir satır açmıyor, öncekinin üstüne yazıyor.
        /* `icon` BİLEREK yok: Android bu görseli bildirimin SAĞ kenarında büyük bir
           kutu olarak basıyor ve solda zaten aynı logo (badge) duruyor — aynı işaret
           iki kez. Kalan tek kopya soldaki. */
        return reg.showNotification(n.title||'CoachOS',{
          body:n.body||'',badge:'logo-mark.png',
          tag:d.alertId||undefined,renotify:true,
          // `coachosAlert`, worker'daki tıklama dinleyicisinin aradığı işaret.
          data:{coachosAlert:{alertId:d.alertId||'',athleteId:d.athleteId||'',teamId:d.teamId||''},
                link:d.link||''}
        });
      }).catch(function(){});
    });
    FOREGROUND_ON=true;
  }catch(e){/* bildirim desteklenmiyorsa sayfanın geri kalanı çalışmaya devam ediyor */}
}

/* Cihazı kaydet. Token'ın KENDİSİ doküman adı: aynı cihaz ikinci kez kaydolursa
   yeni satır açmıyor, aynı satırı tazeliyor. */
function register(){
  return readyServiceWorker()
    .then(function(reg){
      return firebase.messaging(APP).getToken({vapidKey:CFG.vapidKey,serviceWorkerRegistration:reg});
    })
    .then(function(tok){
      if(!tok)throw new Error(T('no_device_id'));
      return db.collection('push_tokens').doc(tok).set({
        uid:USER.uid,kind:'staff',
        coachUid:LINK.coachUid,teamId:LINK.teamId,staffId:LINK.staffId,
        role:LINK.role||'',name:(LINK.staffName||'').trim(),
        lang:lang(),platform:platform(),
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        lastSeenAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    })
    .then(function(){listenForeground();});
}

/* ── Wellness kartı ──────────────────────────────────────────────────────── */
function statusText(st){var k='st_'+st;var v=T(k);return v===k?String(st||'—'):v;}
function reasonText(r){var k='reason_'+r;var v=T(k);return v===k?r:v;}

function metric(ic,label,value,unit,title){
  var v=el('div',{class:'v',text:value});
  if(unit)v.appendChild(el('small',{text:' '+unit}));
  return el('div',{class:'mt',title:title||label},[
    el('div',{class:'k',text:label}),
    el('div',{class:'row'},[icon(ic,19),v])
  ]);
}

function alertCard(a){
  var flagged=isFlagged(a);
  var color=scoreColor(a.overall);
  var card=el('div',{class:'al'+(flagged?'':' quiet')});
  /* Şerit rengi skorun rengi; uyarı vermeyen gönderimde sönük bir gri duruyor.
     Sebebi: iyi skorun mavisi, listenin en dikkat çeken rengi olurdu — oysa o
     satır tam olarak "burada yapılacak bir şey yok" diyen satır. */
  card.appendChild(el('span',{class:'bar',style:'background:'+(flagged?color:'#2c3237')}));

  var sc=el('span',{class:'sc',style:'color:'+color});
  sc.appendChild(el('i',{style:'background:'+color}));
  sc.appendChild(el('span',{text:fmtScore(a.overall)+'/5'}));

  var chev=el('button',{class:'chev','aria-label':T('details'),'aria-expanded':'false',
    onclick:function(){
      var open=card.classList.toggle('open');
      chev.setAttribute('aria-expanded',open?'true':'false');
    }});
  chev.appendChild(icon(ICON.chev,18));

  card.appendChild(el('div',{class:'top'},[
    el('span',{class:'nm',text:(a.athleteName||'').trim()||T('unnamed')}),
    sc,
    el('span',{class:'sep'}),
    el('span',{class:'dt',text:prettyDate(a.date)}),
    chev
  ]));

  var reasons=(a.reasons||[]).map(reasonText);
  card.appendChild(el('div',{class:'why',
    text:reasons.length?reasons.join(' + '):T('no_alert')}));

  var high=a.painHigh||[],mod=a.painModerate||[];
  if(high.length||mod.length){
    var pn=el('div',{class:'pn'});
    high.forEach(function(r){pn.appendChild(el('span',{class:'tag h',text:r}));});
    mod.forEach(function(r){pn.appendChild(el('span',{class:'tag m',text:r}));});
    card.appendChild(pn);
  }

  /* Ölçüm şeridi — sabah formunun soruları, formdaki sırayla: uyku, zihinsel
     yorgunluk, fiziksel yorgunluk, kas ağrısı; dinlenik nabız doluysa sonda.
     Yorgunluk ikiye ayrılmadan önce doldurulmuş bir formun kaydında iki yarım yok,
     tek bir yorgunluk skoru var — o zaman tek kutu. */
  var s=a.scores||{};
  var split=s.mentalFatigue!=null||s.physicalFatigue!=null||s.fatigue==null;
  var boxes=[metric(ICON.sleep,T('m_sleep'),fmtScore(s.sleep))];
  if(split){
    boxes.push(metric(ICON.mental,T('m_mental'),fmtScore(s.mentalFatigue),'',T('f_mental')));
    boxes.push(metric(ICON.fatigue,T('m_physical'),fmtScore(s.physicalFatigue),'',T('f_physical')));
  }else{
    boxes.push(metric(ICON.fatigue,T('m_fatigue'),fmtScore(s.fatigue)));
  }
  boxes.push(metric(ICON.soreness,T('m_soreness'),fmtScore(s.soreness)));
  if(s.RHR!=null)boxes.push(metric(ICON.hr,T('m_hr'),String(Math.round(s.RHR)),'bpm'));
  var strip=el('div',{class:'sub n'+boxes.length},boxes);
  card.appendChild(strip);

  /* Açılan kısım: bildirimin ne olduğu ve kime ulaştığı. Ekip üyesi "bana neden
     gelmedi" diye sorduğunda cevap bu satırda duruyor — kayıt zaten taşıyor,
     ekranda görünmüyordu. */
  var more=el('div',{class:'more'});
  more.appendChild(el('div',{},[
    el('b',{text:T('notif')}),
    el('span',{text:statusText(a.notificationStatus)})
  ]));
  var rec=(a.recipients||[]).filter(function(r){return r&&r.status==='sent';});
  if(rec.length)more.appendChild(el('div',{},[
    el('b',{text:T('reached')}),
    el('span',{text:rec.map(function(r){return (r.name||'').trim()||r.role||T('device');}).join(', ')})
  ]));
  var un=(a.unreachable||[]);
  if(un.length)more.appendChild(el('div',{},[
    el('b',{text:T('unreached')}),
    el('span',{text:un.map(function(r){return (r.name||'').trim()||r.staffId;}).join(', ')})
  ]));
  if(a.teamName)more.appendChild(el('div',{},[el('b',{text:T('team_l')}),el('span',{text:a.teamName})]));
  card.appendChild(more);

  return card;
}

/* ── RPE kartı ───────────────────────────────────────────────────────────────
   Antrenman sonrası formun karşılığı: sporcu, günün en yüksek RPE'si ve günün yükü
   (AU = RPE × dakika) başlıkta; altında yaptığı her bölüm kendi satırında. Şerit
   ve rozet rengi formdaki RPE düğmelerinin rengi: 1 mavi → 10 kırmızı. */
function rpeCard(r){
  var color=rpeColor(r.maxRpe);
  var card=el('div',{class:'al'});
  card.appendChild(el('span',{class:'bar',style:'background:'+color}));
  var sc=el('span',{class:'sc',style:'color:'+color,title:T('max_rpe')});
  sc.appendChild(el('i',{style:'background:'+color}));
  sc.appendChild(el('span',{text:(r.maxRpe==null?'—':fmtScore(r.maxRpe))+'/10'}));
  card.appendChild(el('div',{class:'top'},[
    el('span',{class:'nm',text:(r.athleteName||'').trim()||T('unnamed')}),
    sc,
    el('span',{class:'sep'}),
    el('span',{class:'dt',text:prettyDate(r.date)})
  ]));
  var total=el('div',{class:'why'},[el('span',{text:T('total')+': '}),
    el('b',{style:'color:#eef2f5',text:r.totalLoad==null?'—':String(Math.round(r.totalLoad))+' AU'})]);
  card.appendChild(total);
  var list=el('div',{class:'ss'});
  (r.sessions||[]).forEach(function(x){
    var au=el('span',{class:'au',text:x.load==null?'—':String(Math.round(x.load))});
    if(x.load!=null)au.appendChild(el('small',{text:'AU'}));
    list.appendChild(el('div',{class:'s'},[
      el('span',{class:'rpe',style:'background:'+rpeColor(x.rpe),text:fmtScore(x.rpe)}),
      el('span',{class:'l',text:T('s_'+x.id)}),
      el('span',{class:'d',text:x.duration==null?'—':Math.round(x.duration)+' '+T('min')}),
      au
    ]));
  });
  if((r.sessions||[]).length)card.appendChild(list);
  return card;
}

/* ── Akış: iki sekme, tek gün ───────────────────────────────────────────────
   Wellness ve RPE AYNI ANDA dinleniyor, yalnızca biri görünüyor: sekme
   değiştirmek bekletmiyor ve iki sekmenin sayısı da düğmelerin üstünde hep güncel.
   Hangi sekmede kalındığı telefonda hatırlanıyor — sabah wellness'a, akşam RPE'ye
   bakan antrenör sayfayı son bıraktığı yerde buluyor. */
var LS_TAB='coachos.alerts.tab';
function watchFeed(){
  feedBox.innerHTML='';
  var tab='wellness';
  try{if(localStorage.getItem(LS_TAB)==='rpe')tab='rpe';}catch(e){}

  var tabs=el('div',{class:'seg tabs',role:'tablist'});
  var FEEDS=[
    {id:'wellness',label:T('tab_wellness'),head:T('wellness_h'),col:'wellness_alerts',
     sort:bySeverity,card:alertCard,none:T('wellness_none')},
    {id:'rpe',label:T('tab_rpe'),head:T('rpe_h'),col:'rpe_reports',
     sort:byExertion,card:rpeCard,none:T('rpe_none')},
  ];
  FEEDS.forEach(function(F){
    F.count=el('span',{class:'n',text:'·'});
    F.btn=el('button',{type:'button',role:'tab',onclick:function(){select(F.id);}},
      [el('span',{text:F.label}),F.count]);
    tabs.appendChild(F.btn);
    F.c=el('span',{class:'c',text:''});
    F.list=el('div',{},[el('div',{class:'load',text:T('loading')})]);
    F.pane=el('div',{class:'pane',role:'tabpanel'},[
      el('div',{class:'sec-h'},[el('span',{class:'t',text:F.head}),F.c]),
      F.list
    ]);
  });
  feedBox.appendChild(tabs);
  FEEDS.forEach(function(F){feedBox.appendChild(F.pane);});

  function select(id){
    tab=id;
    try{localStorage.setItem(LS_TAB,id);}catch(e){}
    FEEDS.forEach(function(F){
      var on=F.id===id;
      F.btn.classList.toggle('on',on);
      F.btn.setAttribute('aria-selected',on?'true':'false');
      F.pane.hidden=!on;
    });
  }
  select(tab);

  function paint(F,rows,day){
    /* Sıralama her hâlükârda burada da yapılıyor: sorgu sıralı gelse de gelmese de
       ekrandaki sıra aynı olsun. Wellness'ta sıra ağrı ve skorun birleşiminden,
       RPE'de zorluk ve yükten çıkıyor ve ancak burada kurulabiliyor. */
    rows.sort(F.sort);
    F.count.textContent=String(rows.length);
    F.c.textContent=(rows.length?rows.length+T('records'):'')+prettyDate(day);
    F.list.innerHTML='';
    if(!rows.length){
      F.list.appendChild(el('div',{class:'none',text:F.none}));
      return;
    }
    rows.forEach(function(a){F.list.appendChild(F.card(a));});
  }
  function fail(F,err){
    F.list.innerHTML='';
    F.count.textContent='!';
    var why=(err&&err.code)==='permission-denied'
      ?T('read_denied')
      :T('read_fail')+((err&&err.message)||err);
    F.list.appendChild(el('div',{class:'msg bad',text:why}));
  }
  function rowsOf(snap){var r=[];snap.forEach(function(d){r.push(d.data()||{});});return r;}

  /* YALNIZCA BUGÜN. Gün, sunucudan değil cihazdan okunuyor ve bu bilinçli: formu
     dolduran sporcu da tarihi kendi cihazından seçiyor, yani ikisi aynı takvimi
     kullanıyor.

     Takım sınırı sorgunun içinde duruyor; kurallar da aynı sınırı sunucuda
     uyguluyor — buradaki filtre onun istemci tarafındaki karşılığı, güvenliğin
     kendisi değil. */
  var shownDay=null;
  function subscribe(F,day){
    if(F.unsub){try{F.unsub();}catch(e){}F.unsub=null;}
    var q=db.collection(F.col)
      .where('coachUid','==',LINK.coachUid)
      .where('teamId','==',LINK.teamId)
      .where('date','==',day);
    F.unsub=q.onSnapshot(function(snap){paint(F,rowsOf(snap),day);},function(err){
      /* Üç eşitlik filtresi indeks istemiyor (Firestore bunları kendi tekil
         indeksleriyle birleştiriyor) ama bir kurulumda yine de reddedilirse liste
         boş kalmasın: takımın son kayıtları çekilip gün burada süzülüyor. */
      if((err&&err.code)!=='failed-precondition'){fail(F,err);return;}
      F.unsub=db.collection(F.col)
        .where('coachUid','==',LINK.coachUid)
        .where('teamId','==',LINK.teamId)
        .limit(300)
        .onSnapshot(function(snap){
          paint(F,rowsOf(snap).filter(function(a){return String(a.date||'')===day;}),day);
        },function(e2){fail(F,e2);});
    });
  }
  function subscribeAll(day){
    shownDay=day;
    FEEDS.forEach(function(F){subscribe(F,day);});
  }

  subscribeAll(todayKey());

  /* Gece yarısını geçen açık sekme. Sayfa gün boyu telefonda açık kalabiliyor
     (özellikle ana ekrandan açılmış hâli hiç kapanmıyor) ve o sekme ertesi sabah
     hâlâ dünü dinliyor olurdu — düzeltmenin kendisini boşa çıkaran tam da bu.
     Sayfa her öne geldiğinde gün kontrol ediliyor. */
  function recheck(){
    var d=todayKey();
    if(d!==shownDay)subscribeAll(d);
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)recheck();});
  window.addEventListener('focus',recheck);
  setInterval(recheck,60*1000);
}

boot();
})();
</script>

</html>
