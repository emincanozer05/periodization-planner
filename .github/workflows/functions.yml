# Cloud Function deploy'u — main'e giren her functions/ değişikliğinde.
#
# Testler HER ZAMAN çalışır. Secret yoksa deploy edilemez ve iş KIRMIZIYA DÜŞER.
# Eskiden sessizce atlanıyordu: sekiz koşu üst üste yeşil göründü, function ise
# hiç yayına çıkmamıştı ve bu aylarca fark edilmeyebilirdi. Yayına çıkmayan bir
# deploy işi başarılı değildir; kurulumu CANLIYA-AL.md anlatıyor.
#
# Bildirim gönderimi için saklanacak bir sır YOK: function projenin varsayılan
# servis hesabıyla çalışıyor ve FCM'e o kimlikle gidiyor. GitHub'ın gördüğü tek
# sır, deploy yetkisi olan servis hesabı.
name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # `secrets` bağlamı adım `if`'lerinde doğrudan okunamıyor; iş seviyesinde
      # bir env'e çevirmek bunun bilinen yolu.
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        working-directory: functions
        run: npm ci

      # Uyarı kuralı bozulmuşsa deploy'a hiç gitmesin: eşik, ağrı şiddeti ve
      # "uyarı kime gidiyor" mantığı sahada sessizce yanlış çalışmaktansa burada
      # yüksek sesle patlasın.
      - name: Test
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        if: env.HAS_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        run: >
          npx --yes firebase-tools@15 deploy
          --only functions:wellnessAlert
          --project periodization-planner
          --non-interactive
          --force

      - name: Deploy edilemedi
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          {
            echo "## Function yayına ÇIKMADI"
            echo ""
            echo "\`FIREBASE_SERVICE_ACCOUNT\` secret'ı tanımlı değil, bu yüzden deploy adımı çalışamadı."
            echo "Sunucuda hâlâ bir önceki sürüm duruyor."
            echo ""
            echo "Kurulum, adım adım: **CANLIYA-AL.md**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::FIREBASE_SERVICE_ACCOUNT tanımlı değil — function yayına çıkmadı. Bkz. CANLIYA-AL.md"
          exit 1
