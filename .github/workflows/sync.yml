# Bulut senkronunun kilitlenmediğinin denetimi — her değişiklikte.
#
# "Gösterge sarıda kalıyor" bu depoda defalarca geri geldi ve her seferinde
# ancak sahada, gerçek bir ağ bozulduğunda ortaya çıktı. sync-test.js o anı
# masaya getiriyor: index.html'deki senkron modülünü olduğu gibi alıp sahte bir
# Firestore'a bağlıyor ve bağlantıyı bilerek bozuyor.
#
# Kurulum gerekmiyor: test hiçbir pakete bağlı değil, düz node ile koşuyor.
# Senaryolar gerçek zamanlayıcılarla ilerlediği için iş ~2 dakika sürer.
name: Sync

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sync-test.js
