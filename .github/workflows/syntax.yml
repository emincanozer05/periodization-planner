# Sayfaların sözdizimi denetimi — her değişiklikte.
#
# index.html src/ altındaki parçalardan üretiliyor (node assemble.js --check, ikisinin aynı
# olduğunu; node deps.js --check parça sırasının güvenli olduğunu doğrular). İçindeki JSX yayında build.js ile önceden derleniyor; yerelde ise
# tarayıcıda derlenmeye devam ediyor. Bir sözdizimi hatası KOÇUN EKRANINDA beyaz
# bir sayfa olarak çıkar. Bu iş, o hatayı yayına çıkmadan yakalıyor ve yayın
# derlemesinin (node build.js) ve service worker önbelleğinin (node sw-test.js) de
# hâlâ çalıştığını, güvenlik başlıklarının (node headers-test.js) tutarlı olduğunu ve
# yükleme ekranı / klavye odağı / hareketi azalt kurallarının yerinde olduğunu (node
# shell-test.js) doğruluyor.
#
# Kurulum gerekmiyor: kullanılan derleyici (@babel/standalone) depoda duruyor ve
# tarayıcının yüklediği sürümün eşi.
name: Syntax

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node assemble.js --check
      - run: node deps.js --check
      - run: node check-syntax.js
      - run: node build.js
      - run: node validator-test.js --dist
      - run: node sw-test.js
      - run: node headers-test.js
      - run: node shell-test.js
